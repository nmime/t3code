apiVersion: t3x/v1
kind: EnvironmentProfile
metadata:
  name: typescript-backend
  version: 3
  description: Node 24 + pnpm backend work with Codex, Claude Code and OpenCode available.

runtime:
  platform: linux/amd64
  # Image-backed: every sandbox is a container from $OPENSANDBOX_IMAGE
  # (deploy/sandbox-image), and these resources become its cgroup limits.
  # A `snapshot:` here would ask the server to restore one; the Docker runtime
  # has none, so leave it out on a single-host deployment.
  resources:
    cpu: 4
    memoryGiB: 8

project:
  workingDirectory: /workspace/project
  setup:
    - corepack enable
    - pnpm install --frozen-lockfile
  allowedRepositories:
    - github.com/nmime/*

environment:
  NODE_ENV: development
  CI: "true"

secrets:
  - name: NPM_TOKEN
    secretRef: npm-registry-readonly
    inject: env

agents:
  allowed:
    - codex
    - claude
    - opencode
  defaults:
    provider: codex
    permissionMode: supervised

configuration:
  sources:
    - profile: mac-config-v1

sandbox:
  isolation: per-project
  maxConcurrentTasks: 4
  stopAfterIdleMinutes: 30
  deleteAfterCompletedHours: 48
